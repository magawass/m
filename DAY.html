<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magawa Official Portal</title>

    <!-- Font Awesome for the portal icons -->
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <link rel="preconnect" href="https://magawass.github.io">
    <link rel="dns-prefetch" href="//raw.githubusercontent.com">
    <link rel="dns-prefetch" href="//magawass.github.io">

    <style>
        :root {
            --brand-blue: #173f73;
            --brand-olive: #6f7430;
            --text: #172033;
            --muted: #667085;
            --page-bg: #f5f7fb;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--page-bg);
            color: var(--text);
        }

        body {
            min-height: 100vh;
        }

        /* FRONT PORTAL */
        #frontPage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 34px 18px 45px;
        }

        .portal-card {
            width: 100%;
            max-width: 760px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 38px 28px 42px;
            text-align: center;
            box-shadow: 0 7px 55px rgba(23, 23, 43, 0.50);
        }

        .logo {
            display: block;
            width: 170px;
            height: 150px;
            object-fit: contain;
            margin: 0 auto 1px;
        }

        h1 {
            margin: 0;
            color: var(--brand-blue);
            font-size: clamp(26px, 5vw, 40px);
            line-height: 1.2;
            font-weight: 800;
        }

        .motto {
            margin: 13px 0 34px;
            font-size: clamp(16px, 3vw, 20px);
            font-weight: 600;
            color: var(--brand-olive);
        }

        .instruction {
            margin: 0 0 20px;
            font-size: 15px;
            font-weight: 700;
            color: var(--muted);
            text-transform: lowercase;
        }

        .portal-buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            max-width: 400px;
            margin: 0 auto;
        }

        .action-btn {
            border: 0;
            cursor: pointer;
            min-height: 68px;
            border-radius: 16px;
            padding: 12px 18px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .bg-brandBlue {
            background: var(--brand-blue);
            box-shadow: 0 12px 28px rgba(23, 63, 115, .50);
        }

        .bg-brandOlive {
            background: var(--brand-blue);
            box-shadow: 0 12px 28px rgba(23, 63, 115, .50);
        }

        .icon-box {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            background: rgba(255,255,255,.20);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* RESULT VIEW */
        #resultPage {
            display: none;
            min-height: 100vh;
            background: var(--page-bg);
            flex-direction: column;
        }

        .result-toolbar {
            width: 100%;
            min-height: 62px;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 3px 14px rgba(15,23,42,.07);
            position: relative;
            z-index: 5;
        }

        .back-btn {
            border: 0;
            background: var(--brand-blue);
            color: white;
            border-radius: 11px;
            padding: 11px 17px;
            cursor: pointer;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 7px 18px rgba(23,63,115,.30);
        }

        .back-btn:hover {
            filter: brightness(1.08);
        }

        .result-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 17px;
            color: var(--brand-blue);
            white-space: nowrap;
        }

        .result-frame-wrap {
            flex: 1;
            width: 100%;
            min-height: calc(100vh - 62px);
            padding: 0;
            overflow: hidden;
        }

        #resultFrame {
            width: 100%;
            height: calc(100vh - 62px);
            min-height: 700px;
            border: 0;
            display: block;
            background: white;
        }

        @media (max-width: 620px) {
            #frontPage {
                padding: 20px 12px 30px;
            }

            .portal-card {
                padding: 28px 16px 32px;
                border-radius: 20px;
            }

            .logo {
                width: 135px;
                height: 135px;
            }

            .portal-buttons {
                grid-template-columns: 1fr;
            }

            .action-btn {
                width: 100%;
            }

            .result-title {
                display: none;
            }

            .result-toolbar {
                min-height: 58px;
            }

            #resultFrame {
                height: calc(100vh - 58px);
                min-height: 600px;
            }
        }
    </style>
</head>

<body>

    <!-- FRONT PAGE -->
    <main id="frontPage">
        <section class="portal-card">
            <img
                class="logo"
                src="https://raw.githubusercontent.com/magawass/m/main/logo.png"
                alt="Magawa Secondary School Logo"
            >

          <h1 style="font-weight: normal; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);">MAGAWASS EXAMS PORTAL</h1> 
            <div class="motto">Enter to learn, Depart to Serve.</div>
            <p class="instruction"><em>sankhani / select portal to continue.</em></p>

            <div class="portal-buttons">
                <button                  
                onclick="openPortal('https://magawass.github.io/m/DAY.html','')"
                    class="action-btn bg-brandBlue"
                    type="button"
                >
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M7 2h2v2h6V2h2v2h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V2Zm11 8H6v10h12V10Zm-9 2h2v2H9v-2Zm4 0h2v2h-2v-2Zm-4 3h2v2H9v-2Zm4 0h2v2h-2v-2Z"/>
    </svg>
                    </div>
                    EXAMS-DAY
                </button>

                <button
                    onclick="openPortal('https://magawass.github.io/m/ODL.html','')"
                    class="action-btn bg-brandOlive"
                    type="button"
                >
                    <div class="icon-box">
                        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7v2h3v2H8v-2h3v-2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm0 2v10h16V6H4Z"/>
    </svg>
                    </div>
                    <span style="color: olive;">EXAMS-ODL</span>
                </button>
            </div>
        </section>
    </main>

    <!-- Begin loading both result portals immediately for faster opening. -->
    <link rel="prefetch" href="https://magawass.github.io/m/DAY.html" as="document">
    <link rel="prefetch" href="https://magawass.github.io/m/ODL.html" as="document">

    <!-- RESULT PAGE: displayed inside this same portal -->
    <section id="resultPage" aria-label="Results portal">
        <div class="result-toolbar">
            <button class="back-btn" onclick="returnToFront()" type="button">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="m10 5-7 7 7 7 1.4-1.4L6.8 13H21v-2H6.8l4.6-4.6L10 5Z"/>
    </svg>
                Back
            </button>
            <h2 id="resultTitle" class="result-title">Results</h2>
        </div>

        <div class="result-frame-wrap">
            <iframe
                id="resultFrame"
                title="Magawa Results"
                src="about:blank"
                allow="fullscreen"
            ></iframe>
        </div>
    </section>

    <script>
        // Keep the two result URLs ready so clicking feels instantaneous.
        const portalCache = {
            day: 'https://magawass.github.io/m/DAY.html',
            odl: 'https://magawass.github.io/m/ODL.html'
        };

        function openPortal(url, title) {
            const frontPage = document.getElementById('frontPage');
            const resultPage = document.getElementById('resultPage');
            const resultFrame = document.getElementById('resultFrame');
            const resultTitle = document.getElementById('resultTitle');

            resultTitle.textContent = title || 'Results';

            // Show the result container immediately, then navigate the iframe.
            // This avoids waiting for any animation or extra page transition.
            frontPage.style.display = 'none';
            resultPage.style.display = 'flex';

            if (resultFrame.src !== url) {
                resultFrame.src = url;
            }

            window.scrollTo(0, 0);
        }

        function returnToFront() {
            const frontPage = document.getElementById('frontPage');
            const resultPage = document.getElementById('resultPage');
            const resultFrame = document.getElementById('resultFrame');

            // Keep the loaded result page in the iframe so reopening it is fast.
            resultPage.style.display = 'none';
            frontPage.style.display = 'flex';

            window.scrollTo(0, 0);
        }

        // Browser back button also returns to the front page when possible.
        window.addEventListener('popstate', function () {
            returnToFront();
        });
    </script>

</body>
</html>
