<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magawa Secondary Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {background:#666;font-family:Arial,sans-serif;margin:0;padding:0;display:flex;justify-content:center;align-items:center;min-height:100vh}
    .page {display:none;width:50%;max-width:650px;padding:20px;background:#fff;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.1)}
    #initialPage {display:block;text-align:center}
    .logo {max-width:220px;height:120px}
    h1,h2 {color:#555;margin:5px 0}
    label {display:block;margin-top:15px;font-weight:bold;color:#333}
    select,input {width:50%;padding:12px;margin-top:8px;border-radius:6px;border:1px solid #ccc;font-size:1em}
    button {width:50%;margin-top:20px;padding:12px;background:#007bff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:1.1em;transition:.3s}
    button:hover {background:#0056b3}
    .header-row {display:flex;justify-content:space-between;align-items:flex-start}
    .header-text {text-align:right;line-height:1.2}
    .divider-line {border:none;border-top:2px solid #004080;margin:8px 0 12px;width:100%}
    .progress-title {font-family:"Agency FB",sans-serif;font-size:1.2em;color:#000;margin:5px 0 10px;text-align:left}
    .info-row {display:flex;justify-content:space-between;font-size:1em;margin-bottom:4px}
    table {width:100%;border-collapse:collapse;margin-top:10px;font-size:.95em}
    th,td {border:1px solid #ccc;padding:6px}
    th {background:#e9ecef;text-align:center}
    td:first-child {text-align:left}
    td:not(:first-child) {text-align:center}
    .summary-section {margin-top:10px}
    .summary-section table {width:100%;border:1px solid #ccc;font-size:.95em}
    .summary-section th,.summary-section td {border:1px solid #ccc;padding:8px;text-align:left}
    .actions {text-align:center;margin-top:15px}
    .actions button {width:15%;margin:5px}
    .final-remark {margin-top:10px;font-weight:bold;text-align:left;font-size:1.1em;color:#004080}
  </style>
</head>
<body>
  <div id="initialPage" class="page">
    <img src="https://raw.githubusercontent.com/magawass/m/main/logo.png" alt="Magawa Secondary School Logo" class="logo">
    <h1><p style="font-size:28px;">MAGAWA SECONDARY</p></h1>  
    <h2>STUDENTS PORTAL</h2>
    <label for="selectedForm">Select Class/Form</label>
    <select id="selectedForm">
      <option value="">-- Select Class --</option>
      <option value="form1">Form 1</option>
      <option value="form2">Form 2</option>
      <option value="form3">Form 3</option>
      <option value="form4">Form 4</option>
    </select>
    <label for="studentNumberInput">Enter Exam Number</label>
    <input type="text" id="studentNumberInput" placeholder="e.g. J047/001 or M047/001">
    <label for="dobInput">Enter Date of Birth</label>
    <input type="date" id="dobInput">
    <button onclick="loadResults()">View Results</button>
    <button onclick="openAdmin()">Admin</button>
    <p style="font-size:11px;">For Magawa Exam Department. Created by Chiku Lubaini. All rights reserved.</p>
  </div>

  <div id="resultPage" class="page">
    <div class="header-row">
      <img src="https://raw.githubusercontent.com/magawass/m/main/logo.png" alt="School Logo" class="logo">
      <div class="header-text">
        <h2>MAGAWA SEC SCHOOL</h2>
        <p>Private Bag 17, Magawa, Mchinji</p>
      </div>
    </div>
    <hr class="divider-line">
    <div class="progress-title">PROGRESS OF RESULTS</div>
    <div class="info-row">
      <p><strong>Name:</strong> <span id="studentName"></span></p>
      <p><strong>Exam No:</strong> <span id="studentID"></span></p>
    </div>
    <div class="info-row">
      <p><strong>Class:</strong> <span id="studentForm"></span></p>
      <p><strong>Term:</strong> <span id="studentTerm">1</span></p>
    </div>
    <div id="resultsContainer"></div>
    <div class="summary-section" id="summarySection"></div>
    <div class="final-remark" id="finalRemark"></div>
    <div class="actions">
      <button onclick="openPrintView()">Print</button>
      <button onclick="openFullPdf()">Download</button>
      <button onclick="backToInitialPage()">Back</button>
    </div>
  </div>

  <div id="adminPage" class="page" style="text-align:center;">
    <h2 id="adminLabel">Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Enter Password">
    <button id="adminLoginBtn" onclick="verifyAdmin()">Login</button>
    <button onclick="backToInitialPage()">Back</button>
    <div id="adminPanel" style="display:none;margin-top:20px;">
      <h3>Manage CSV Files</h3>
      <label for="githubToken">Authorization Code</label>
      <input type="password" id="githubToken" placeholder="Paste token here">
      <label for="classDropdown">Select Class:</label>
      <select id="classDropdown">
        <option value="">--Select Class--</option>
        <option value="form1">Form 1</option>
        <option value="form2">Form 2</option>
        <option value="form3">Form 3</option>
        <option value="form4">Form 4</option>
      </select>
      <input type="file" id="csvUpload" accept=".csv">
      <button onclick="uploadCSV()">Upload CSV</button>
      <label for="deleteDropdown">Select File to Delete:</label>
      <select id="deleteDropdown">
        <option value="">-- Select CSV File --</option>
      </select>
      <button onclick="deleteCSV()">Delete Selected CSV</button>
      <button onclick="refreshFileList()">↻ Refresh List</button>
    </div>
  </div>

<script>
const SUBJECT_ORDER=['Agriculture','Bible Knowledge','Biology','Chemistry','Chichewa','English','Geography','History','Mathematics','Physics','Social/Life'];

function loadResults(){
  const form=document.getElementById('selectedForm').value;
  const studentNumber=document.getElementById('studentNumberInput').value.trim();
  const dob=document.getElementById('dobInput').value.trim();
  if(!form||!studentNumber||!dob){alert('Please fill in all fields.');return;}
  fetch(`https://raw.githubusercontent.com/magawass/m/main/${form}.csv`)
    .then(r=>r.text())
    .then(csv=>{
      const parsed=Papa.parse(csv,{header:true});
      const data=parsed.data;
      const dobInput=new Date(dob);
      const formattedDob=`${dobInput.getFullYear()}-${(dobInput.getMonth()+1).toString().padStart(2,'0')}-${dobInput.getDate().toString().padStart(2,'0')}`;
      const student=data.find(s=>s['Exam Number']===studentNumber&&s['Date of Birth']===formattedDob);
      if(!student){alert('No results found.');return;}
            document.getElementById('studentName').textContent=student["STUDENT'S NAME"];
      document.getElementById('studentID').textContent=student["Exam Number"];
      document.getElementById('studentForm').textContent=form.toUpperCase();

      // MODIFICATION START: Use the full SUBJECT_ORDER array
      const subjectsToDisplay=SUBJECT_ORDER;
      // The `subjects` variable is used later for Total/Average/Aggregate calculation
      // and final remark logic, so we keep the check for subjects *in the student data*
      // but ensure we use the full list for table display.
      const subjects=SUBJECT_ORDER.filter(sub=>sub in student);


      let tableHTML='<table><tr><th>Subject</th><th>Score</th><th>Grade</th><th>Position</th><th>Remark</th></tr>';
      let total=0;let grades=[];

      // Iterate over the *full* list for display
      subjectsToDisplay.forEach(sub=>{
        // The raw value will be undefined if the subject isn't in the student's record
        const raw=student[sub];
        // The score calculation handles missing/undefined data by defaulting to 0
        const score=parseInt(raw)||0;
        
        // Only include score/grade in total/aggregate calculation if the subject
        // was originally present in the data (as in the previous logic)
        if (subjects.includes(sub)) {
          total+=score;
          const grade=getGrade(score,form);
          grades.push(grade);
        }
        
        const grade=getGrade(score,form);
        const subjectPosition=computeSubjectPosition(data,sub,score);
        tableHTML+=`<tr><td>${sub}</td><td>${score}</td><td>${grade}</td><td>${subjectPosition}</td><td>${getSubjectRemark(score,form)}</td></tr>`;
      });
      // MODIFICATION END

      tableHTML+='</table>';
      document.getElementById('resultsContainer').innerHTML=tableHTML;

      const position=computeOverallPosition(data,form,subjects);

      let summaryHTML='';
      if(form==='form1'||form==='form2'){
        // If no subjects were found, prevent division by zero for avg
        const avg=subjects.length > 0 ? Math.round(total/subjects.length) : 0;
        summaryHTML=`<table>
          <tr><th>Total</th><th>Average</th><th>Overall Position in Class</th></tr>
          <tr><td>${total}</td><td>${avg}</td><td>${position}</td></tr>
        </table>`;
      }else{
        const numericGrades=grades.map(g=>parseInt(g)).sort((a,b)=>a-b);
        const aggregate=numericGrades.slice(0,6).reduce((sum,g)=>sum+g,0);
        summaryHTML=`<table>
          <tr><th>Aggregate</th><th>Overall Position in Class</th></tr>
          <tr><td>${aggregate}</td><td>${position}</td></tr>
        </table>`;
      }
      document.getElementById('summarySection').innerHTML=summaryHTML;
      document.getElementById('finalRemark').textContent=getFinalRemark(subjects,student,form);

      document.querySelectorAll('.page').forEach(p=>p.style.display='none');
      document.getElementById('resultPage').style.display='block';
    })
    .catch(()=>alert('Failed to load results.'));
}

function computeSubjectPosition(classData,subject,myScore){
  const scores=classData.filter(s=>s&&s[subject]).map(s=>parseInt(s[subject])||0);
  scores.sort((a,b)=>b-a);
  const index=scores.indexOf(myScore);
  return index>=0?(index+1):'-';
}

function computeOverallPosition(classData,form,subjects){
  const metrics=[];
  classData.forEach(s=>{
    if(!s||!s["Exam Number"])return;
    let total=0;let grades=[];
    subjects.forEach(sub=>{
      const score=parseInt(s[sub])||0;
      total+=score;
      grades.push(getGrade(score,form));
    });
    if(form==='form1'||form==='form2'){
      metrics.push({id:s["Exam Number"],value:total,better:(a,b)=>a>b});
    }else{
      const numeric=grades.map(g=>parseInt(g)).sort((a,b)=>a-b);
      const aggregate=numeric.slice(0,6).reduce((sum,g)=>sum+g,0);
      metrics.push({id:s["Exam Number"],value:aggregate,better:(a,b)=>a<b});
    }
  });
  const me=metrics.find(m=>m.id===document.getElementById('studentID').textContent);
  if(!me)return'-';
  const betterCount=metrics.reduce((acc,m)=>acc+(m.better(m.value,me.value)?1:0),0);
  return betterCount+1;
}

function getGrade(score,form){
  if(form==='form1'||form==='form2'){
    if(score>=80)return'A';
    if(score>=65)return'B';
    if(score>=55)return'C';
    if(score>=40)return'D';
    return'F';
  }else{
    if(score>=80)return'1';
    if(score>=75)return'2';
    if(score>=70)return'3';
    if(score>=65)return'4';
    if(score>=60)return'5';
    if(score>=55)return'6';
    if(score>=45)return'7';
    if(score>=35)return'8';
    return'9';
  }
}

function getSubjectRemark(score,form){
  if(form==='form1'||form==='form2'){
    if(score>=80)return'Excellent';
    if(score>=65)return'Very good';
    if(score>=55)return'Good';
    if(score>=40)return'Average';
    return'Fail';
  }else{
    if(score>=75)return'Distinction';
    if(score>=70)return'Strong credit';
    if(score>=65)return'Strong credit';
    if(score>=60)return'Credit';
    if(score>=55)return'Credit';
    if(score>=45)return'Pass';
    if(score>=35)return'Pass';
    return'Fail';
  }
}

function getFinalRemark(subjects,student,form){
  let passedSubjects=0;let englishPassed=false;
  subjects.forEach(sub=>{
    const score=parseInt(student[sub]);
    if(form==='form1'||form==='form2'){
      if(score>=40){passedSubjects++;if(sub==='English')englishPassed=true;}
    }else{
      if(score>=35){passedSubjects++;if(sub==='English')englishPassed=true;}
    }
  });
  return(passedSubjects>=6&&englishPassed)?'Pass':'Fail';
}

function openPrintView(){window.print();}
function openFullPdf(){
  html2canvas(document.getElementById('resultPage')).then(canvas=>{
    const imgData=canvas.toDataURL('image/png');
    const pdf=new jspdf.jsPDF();
    const imgProps=pdf.getImageProperties(imgData);
    const pdfWidth=pdf.internal.pageSize.getWidth();
    const pdfHeight=(imgProps.height*pdfWidth)/imgProps.width;
    pdf.addImage(imgData,'PNG',0,0,pdfWidth,pdfHeight);
    pdf.save('Magawa_Results.pdf');
  });
}

const GITHUB_USER='magawass';
const GITHUB_REPO='m';

function openAdmin(){
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.getElementById('adminPage').style.display='block';
}

function backToInitialPage(){
  document.querySelectorAll('.page').forEach(p=>p.style.display='none');
  document.getElementById('initialPage').style.display='block';
  document.getElementById('selectedForm').value='';
  document.getElementById('studentNumberInput').value='';
  document.getElementById('dobInput').value='';
  document.getElementById('adminPassword').value='';
  document.getElementById('githubToken').value='';
  document.getElementById('adminPanel').style.display='none';
  document.getElementById('adminLabel').style.display='block';
  document.getElementById('adminPassword').style.display='inline-block';
  document.getElementById('adminLoginBtn').style.display='inline-block';
}

function verifyAdmin(){
  const pass=document.getElementById('adminPassword').value;
  if(pass==='magawa123'){
    document.getElementById('adminPanel').style.display='block';
    document.getElementById('adminLabel').style.display='none';
    document.getElementById('adminPassword').style.display='none';
    document.getElementById('adminLoginBtn').style.display='none';
    refreshFileList();
  }else{alert('Incorrect password');}
}

function uploadCSV(){
  const className=document.getElementById('classDropdown').value;
  const fileInput=document.getElementById('csvUpload');
  const file=fileInput.files[0];
  const token=document.getElementById('githubToken').value.trim();
  if(!className||!file||!token){alert('Please select a class, choose a file, and enter your GitHub token.');return;}
  const reader=new FileReader();
  reader.onload=function(){
    const content=reader.result;
    const encodedContent=btoa(unescape(encodeURIComponent(content)));
    fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${className}.csv`,{
      method:'PUT',
      headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({message:`Upload ${className}.csv`,content:encodedContent})
    })
    .then(res=>res.json())
    .then(()=>{alert('Upload successful.');refreshFileList();})
    .catch(()=>alert('Upload failed. Check token and repo permissions.'));
  };
  reader.readAsText(file);
}

function deleteCSV(){
  const fileName=document.getElementById('deleteDropdown').value;
  const token=document.getElementById('githubToken').value.trim();
  if(!fileName||!token){alert('Please select a file and enter your GitHub token.');return;}
  fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
    headers:{'Authorization':`Bearer ${token}`}
  })
  .then(res=>res.json())
  .then(fileData=>{
    const sha=fileData.sha;
    fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`,{
      method:'DELETE',
      headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({message:`Delete ${fileName}`,sha:sha})
    })
    .then(()=>{alert('File deleted.');refreshFileList();})
    .catch(()=>alert('Delete failed. Check token and file name.'));
  });
}

function refreshFileList(){
  fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`)
    .then(res=>res.json())
    .then(files=>{
      const dropdown=document.getElementById('deleteDropdown');
      dropdown.innerHTML='<option value="">-- Select CSV File --</option>';
      files.forEach(file=>{
        if(file.name.endsWith('.csv')){
          const opt=document.createElement('option');
          opt.value=file.name;
          opt.textContent=file.name;
          dropdown.appendChild(opt);
        }
      });
    })
    .catch(()=>alert('Failed to load file list.'));
}
</script>
</body>
</html>
