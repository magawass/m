<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magawa Secondary | Official Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#1a2a6c", secondary: "#fdbb2d", accent: "#20B2AA" }
                }
            }
        }

        const GITHUB_CONFIG = { owner: "magawass", repo: "ui", path: "data/content.json" };
        let adminContent = {};

        function showPage(pageId) {
            document.getElementById('mainNav').style.display = 'block';
            document.getElementById('mainFooter').style.display = 'block';
            const pages = document.querySelectorAll('.page');
            pages.forEach(p => p.classList.remove('active'));
            const target = document.getElementById(pageId);
            if (target) target.classList.add('active');
            window.scrollTo(0,0);
        }

        function openPortal() {
            document.getElementById('mainNav').style.display = 'none';
            document.getElementById('mainFooter').style.display = 'none';
            const pages = document.querySelectorAll('.page');
            pages.forEach(p => p.classList.remove('active'));
            document.getElementById('portalContainer').classList.add('active');
        }

        function setSyncStatus(msg, isError = false) {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = msg;
            statusEl.className = isError ? "text-red-500 font-bold ml-4 text-xs" : "text-green-500 font-bold ml-4 text-xs";
        }

        async function loadContent() {
            try {
                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    const decoded = decodeURIComponent(escape(atob(data.content)));
                    adminContent = JSON.parse(decoded);
                    updateDisplayContent();
                }
            } catch (error) {
                console.log("Remote load failed.");
                adminContent = JSON.parse(localStorage.getItem('magawaAdminContent')) || {
                    announcements: "Welcome to our digital campus.",
                    aboutText: "Dedicated to academic excellence and moral integrity in the heart of Mchinji.",
                    upcoming: "Stay tuned for termly events.",
                    adverts: { text: "", image: "" },
                    noticeBoard: { text: "Important notices will appear here.", image: "" },
                    mediaGallery: { caption: "Latest media", file: "" }
                };
                updateDisplayContent();
            }
        }

        function updateDisplayContent() {
            document.getElementById('displayAnnouncement').innerText = adminContent.announcements || "";
            document.getElementById('displayAboutText').innerText = adminContent.aboutText || "";
            document.getElementById('displayUpcoming').innerText = adminContent.upcoming || "";
            const adC = document.getElementById('displayAdverts');
            adC.innerHTML = adminContent.adverts?.image ? `<img src="${adminContent.adverts.image}" class="w-full rounded mb-2">` : "";
            adC.innerHTML += `<p class="text-sm italic">${adminContent.adverts?.text || ''}</p>`;
            const noticeC = document.getElementById('displayNoticeBoard');
            noticeC.innerHTML = adminContent.noticeBoard?.image ? `<img src="${adminContent.noticeBoard.image}" class="w-full max-h-64 object-cover rounded mb-3">` : "";
            noticeC.innerHTML += `<p>${adminContent.noticeBoard?.text || ''}</p>`;
            const galD = document.getElementById('galleryDisplay');
            if (adminContent.mediaGallery?.file) {
                const isImg = adminContent.mediaGallery.file.startsWith('data:image');
                galD.innerHTML = isImg ? `<img src="${adminContent.mediaGallery.file}" class="w-full h-full object-cover rounded-lg">` : `<video controls class="w-full h-full rounded-lg"><source src="${adminContent.mediaGallery.file}"></video>`;
            }
            document.getElementById('displayCaption').innerText = adminContent.mediaGallery?.caption || "Latest media";
        }

        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        let scale = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        function removeImg(key) {
            if(key === 'ad') adminContent.adverts.image = "";
            if(key === 'notice') adminContent.noticeBoard.image = "";
            if(key === 'media') adminContent.mediaGallery.file = "";
            setSyncStatus("Image removed. Save to apply.");
        }

        async function saveAdminContent() {
            const token = document.getElementById('ghTokenInput').value.trim();
            if (!token) { setSyncStatus("Error: No Token", true); return; }

            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>SAVING...';
            btn.disabled = true;
            setSyncStatus("Connecting to GitHub...");

            try {
                adminContent.announcements = document.getElementById('adminAnnounceInput').value;
                adminContent.aboutText = document.getElementById('adminAboutInput').value;
                adminContent.upcoming = document.getElementById('adminUpcomingInput').value;
                adminContent.adverts.text = document.getElementById('adminAdvertsInput').value;
                adminContent.noticeBoard.text = document.getElementById('adminNoticeInput').value;
                adminContent.mediaGallery.caption = document.getElementById('mediaCaptionInput').value;

                if (document.getElementById('adUpload').files[0]) adminContent.adverts.image = await resizeImage(document.getElementById('adUpload').files[0]);
                if (document.getElementById('noticeUpload').files[0]) adminContent.noticeBoard.image = await resizeImage(document.getElementById('noticeUpload').files[0]);
                if (document.getElementById('mediaUpload').files[0]) adminContent.mediaGallery.file = await resizeImage(document.getElementById('mediaUpload').files[0]);

                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
                let sha = "";
                const checkRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if (checkRes.ok) { const d = await checkRes.json(); sha = d.sha; }

                const finalJson = JSON.stringify(adminContent);
                const base64Content = btoa(unescape(encodeURIComponent(finalJson)));

                const syncRes = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Update UI content", content: base64Content, sha: sha })
                });

                if (syncRes.ok) {
                    setSyncStatus("✅ Sync Successful!");
                    localStorage.setItem('magawaAdminContent', finalJson);
                    updateDisplayContent();
                } else {
                    const errData = await syncRes.json();
                    setSyncStatus(`❌ Failed: ${errData.message}`, true);
                }
            } catch (err) {
                setSyncStatus(`❌ Error: ${err.message}`, true);
            } finally {
                btn.innerHTML = '<i class="fas fa-save mr-2"></i>SAVE CHANGES TO REPOSITORY';
                btn.disabled = false;
            }
        }

        function authenticateAdmin() {
            if (document.getElementById('adminPass').value === 'admin123') showPage('adminPanel');
            else alert('Invalid Password');
        }

        document.addEventListener('DOMContentLoaded', loadContent);
    </script>
    
    <style>
        .page { display: none; }
        .page.active { display: block; }
        #portalContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: white; z-index: 1000; }
        iframe { width: 100%; height: calc(100vh - 60px); border: none; }
        .admin-input { border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-size: 13px; width: 100%; margin-bottom: 10px; }
        .file-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <nav id="mainNav" class="bg-primary text-white sticky top-0 z-50 p-3 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="https://raw.githubusercontent.com/magawass/m/main/logo.png" class="h-10 w-10 rounded-full border border-secondary">
                <span class="font-bold text-lg">MAGAWA SECONDARY</span>
            </div>
            <div class="hidden md:flex space-x-6 text-xs font-bold uppercase">
                <button onclick="showPage('homePage')">Home</button>
                <button onclick="openPortal()" class="bg-secondary text-primary px-3 py-1 rounded">Portal</button>
                <button onclick="showPage('adminLogin')">Admin</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8">
        <div id="homePage" class="page active space-y-10">
            <div class="bg-primary rounded-3xl p-10 text-white flex justify-between items-center">
                <div class="w-2/3">
                    <h2 class="text-3xl font-black mb-4 uppercase">Enter to Learn,Depart to Serve.</h2>
                    <p id="displayAboutText" class="opacity-90 mb-6"></p>
                    <button onclick="openPortal()" class="bg-white text-primary px-6 py-2 rounded-lg font-bold">Exam Portal</button>
                </div>
                <i class="fas fa-graduation-cap text-[100px] opacity-30"></i>
            </div>
            <div class="grid md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-primary">
                    <h3 class="font-bold mb-3 uppercase text-xs tracking-widest">About Us</h3>
                    <p id="displayAnnouncement" class="text-sm"></p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-accent">
                    <h3 class="font-bold mb-3 uppercase text-xs tracking-widest">Gallery</h3>
                    <div id="galleryDisplay" class="bg-gray-100 aspect-video rounded-lg overflow-hidden"></div>
                    <p id="displayCaption" class="text-xs mt-2 text-center italic"></p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-secondary">
                    <h3 class="font-bold mb-3 uppercase text-xs tracking-widest">Upcoming</h3>
                    <p id="displayUpcoming" class="text-sm"></p>
                </div>
            </div>
            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl border-t-4 border-green-500"><h3 class="font-bold mb-3 text-green-600">Announcements</h3><div id="displayAdverts"></div></div>
                <div class="bg-white p-6 rounded-2xl border-t-4 border-orange-500"><h3 class="font-bold mb-3 text-orange-600">Social Welfare/Entertainment</h3><div id="displayNoticeBoard"></div></div>
            </div>
        </div>

        <div id="adminLogin" class="page max-w-md mx-auto py-20 text-center">
            <div class="bg-white p-8 rounded-3xl shadow-lg border">
                <h2 class="text-xl font-bold mb-6 text-primary">ADMIN LOGIN</h2>
                <input type="password" id="adminPass" placeholder="Password" class="admin-input text-center">
                <button onclick="authenticateAdmin()" class="w-full bg-primary text-white py-3 rounded-xl font-bold mt-2">LOG IN</button>
            </div>
        </div>

        <div id="adminPanel" class="page max-w-5xl mx-auto py-6">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <div class="flex items-center">
                    <h2 class="text-2xl font-black text-primary uppercase">Repo Manager</h2>
                    <span id="syncStatus" class="ml-4 text-xs font-bold text-gray-400 italic">Ready</span>
                </div>
                <button onclick="showPage('homePage')" class="text-xs font-bold text-gray-500 underline uppercase">Close</button>
            </div>

            <div class="bg-white p-4 rounded-xl border-2 border-primary/10 mb-6">
                <label class="block text-[10px] font-black text-primary mb-2 uppercase tracking-widest">GitHub Token (Authentication)</label>
                <input type="password" id="ghTokenInput" placeholder="Enter Token to Sync" class="admin-input border-dashed border-2">
            </div>

            <div class="grid md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <div class="bg-white p-6 rounded-2xl border">
                        <label class="block text-[10px] font-bold text-gray-400 mb-2 uppercase">Main Content</label>
                        <textarea id="adminAboutInput" class="admin-input h-24" placeholder="About Text"></textarea>
                        <textarea id="adminAnnounceInput" class="admin-input" placeholder="Announcement"></textarea>
                        <textarea id="adminUpcomingInput" class="admin-input" placeholder="Upcoming Events"></textarea>
                    </div>
                </div>
                <div class="space-y-4">
                    <div class="bg-white p-6 rounded-2xl border">
                        <label class="block text-[10px] font-bold text-gray-400 mb-2 uppercase">Media (Auto-Resized)</label>
                        <div class="mb-4">
                            <div class="file-wrapper"><input type="file" id="noticeUpload" class="text-xs flex-grow"><button onclick="removeImg('notice')" class="text-red-500 text-sm"><i class="fas fa-trash"></i></button></div>
                            <textarea id="adminNoticeInput" class="admin-input" placeholder="Notice Text"></textarea>
                        </div>
                        <div class="mb-4">
                            <div class="file-wrapper"><input type="file" id="adUpload" class="text-xs flex-grow"><button onclick="removeImg('ad')" class="text-red-500 text-sm"><i class="fas fa-trash"></i></button></div>
                            <textarea id="adminAdvertsInput" class="admin-input" placeholder="Advert Text"></textarea>
                        </div>
                        <div>
                            <div class="file-wrapper"><input type="file" id="mediaUpload" class="text-xs flex-grow"><button onclick="removeImg('media')" class="text-red-500 text-sm"><i class="fas fa-trash"></i></button></div>
                            <input type="text" id="mediaCaptionInput" class="admin-input" placeholder="Gallery Caption">
                        </div>
                    </div>
                    <button id="saveBtn" onclick="saveAdminContent()" class="w-full bg-primary text-white py-5 rounded-2xl font-black shadow-xl uppercase tracking-widest hover:scale-[1.01] transition-all">
                        <i class="fas fa-save mr-2"></i>SAVE CHANGES TO REPOSITORY
                    </button>
                </div>
            </div>
        </div>

        <div id="portalContainer" class="page">
            <div class="bg-white p-3 border-b flex justify-between items-center">
                <button onclick="showPage('homePage')" class="text-primary font-bold px-4">EXIT</button>
                <div class="text-xs font-black tracking-widest"> </div>
                <div class="w-10"></div>
            </div>
            <iframe src="brief22_BUTTONS_FIXED.html"></iframe>
        </div>
    </main>

    <footer id="mainFooter" class="py-10 text-center text-[10px] text-gray-400 uppercase tracking-widest border-t mt-10">
        © 2025 Magawa Secondary School. Designed by CHiku Lubaini(0994039325).
    </footer>

</body>
</html>
