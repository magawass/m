<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Magawa Secondary Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      background-color: #d0e7ff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .page {
      display: none;
      width: 100%;
      max-width: 650px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    #initialPage {
      display: block;
      text-align: center;
    }
    .logo {
      max-width: 200px;
      height: 100px;
    }
    h1, h2 {
      color: #004080;
      margin: 5px 0;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }
    select, input {
      width: 90%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    button {
      width: 90%;
      margin-top: 20px;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1em;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .header-text {
      text-align: right;
      line-height: 1.2;
    }
    .divider-line {
      border: none;
      border-top: 2px solid #004080;
      margin: 8px 0 12px 0;
      width: 100%;
    }
    .progress-title {
      font-family: "Agency FB", sans-serif;
      font-size: 1.2em;
      color: #000;
      margin: 5px 0 10px 0;
      text-align: left;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 1em;
      margin-bottom: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.95em;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
    }
    th {
      background-color: #e9ecef;
      text-align: center;
    }
    td:first-child {
      text-align: left;
    }
    td:not(:first-child) {
      text-align: center;
    }
    .summary-section {
      margin-top: 10px;
    }
    .summary-section table {
      width: 100%;
      border: 1px solid #ccc;
      font-size: 0.95em;
    }
    .summary-section th, .summary-section td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    .actions {
      margin-top: 15px;
      text-align: center;
    }
    .actions button {
      width: 45%;
      margin: 5px;
    }
  </style>
</head>
<body>
  <div id="initialPage" class="page">
    <img src="https://raw.githubusercontent.com/magawass/m/main/logo.png" alt="Magawa Secondary School Logo" class="logo">
    <h1><p style="font-size:28px;">MAGAWA SECONDARY</p></h1>  
    <h2>STUDENTS PORTAL</h2>
    <label for="selectedForm">Select Class/Form</label>
    <select id="selectedForm">
      <option value="">-- Select Class --</option>
      <option value="form1">Form 1</option>
      <option value="form2">Form 2</option>
      <option value="form3">Form 3</option>
      <option value="form4">Form 4</option>
    </select>
    <label for="studentNumberInput">Enter Exam Number</label>
    <input type="text" id="studentNumberInput" placeholder="e.g. J047/001">
    <label for="dobInput">Enter Date of Birth</label>
    <input type="date" id="dobInput" placeholder="e.g. 2008-05-12">
    <button onclick="loadResults()">View Results</button>
    <button onclick="openAdmin()">Admin</button>
    <p><br><br></p>
    <p style="font-size: 11px;">For Magawa Exam Department. Created by Chiku Lubaini. All rights reserved.</p>
  </div>
  <div id="resultPage" class="page">
    <div class="header-row">
      <img src="https://raw.githubusercontent.com/magawass/m/main/logo.png" alt="School Logo" class="logo">
      <div class="header-text">
        <h2>MAGAWA SEC SCHOOL</h2>
        <p>Private Bag 17, Magawa, Mchinji</p>
      </div>
    </div>
    <hr class="divider-line">
    <div class="progress-title">PROGRESS OF RESULTS</div>
    <div class="info-row">
      <p><strong>Name:</strong> <span id="studentName"></span></p>
      <p><strong>Exam No:</strong> <span id="studentID"></span></p>
    </div>
    <div class="info-row">
      <p><strong>Class:</strong> <span id="studentForm"></span></p>
      <p><strong>Term:</strong> <span id="studentTerm">1</span></p>
    </div>
    <div id="resultsContainer"></div>
    <div class="actions">
      <button onclick="openPrintView()">Print</button>
      <button onclick="openFullPdf()">Download PDF</button>
      <button onclick="backToInitialPage()">Back</button>
    </div>
  </div>

  <div id="adminPage" class="page" style="text-align:center;">
    <h2 id="adminLabel">Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Enter Password">
    <button id="adminLoginBtn" onclick="verifyAdmin()">Login</button>
    <button onclick="backToInitialPage()">Back</button>
    <div id="adminPanel" style="display:none;margin-top:20px;">
      <h3>Manage CSV Files</h3>
      <label for="githubToken">Enter GitHub Token</label>
      <input type="password" id="githubToken" placeholder="Paste token here">
      <label for="classDropdown">Select Class:</label>
      <select id="classDropdown">
        <option value="">--Select Class--</option>
        <option value="form1">Form 1</option>
        <option value="form2">Form 2</option>
        <option value="form3">Form 3</option>
        <option value="form4">Form 4</option>
      </select>
      <input type="file" id="csvUpload" accept=".csv">
      <button onclick="uploadCSV()">Upload CSV</button>
      <label for="deleteDropdown">Select File to Delete:</label>
      <select id="deleteDropdown">
        <option value="">-- Select CSV File --</option>
      </select>
      <button onclick="deleteCSV()">Delete Selected CSV</button>
      <button onclick="refreshFileList()">↻ Refresh List</button>
    </div>
  </div>

  <script>
    let currentForm = '';
    const GITHUB_USER = 'magawass';
    const GITHUB_REPO = 'm';

    function openAdmin() {
      document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
      document.getElementById('adminPage').style.display = 'block';
    }

    function backToInitialPage() {
      document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
      document.getElementById('initialPage').style.display = 'block';
      document.getElementById('selectedForm').value = '';
      document.getElementById('studentNumberInput').value = '';
      document.getElementById('dobInput').value = '';
      document.getElementById('adminPassword').value = '';
      document.getElementById('githubToken').value = '';
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('adminLabel').style.display = 'block';
      document.getElementById('adminPassword').style.display = 'inline-block';
      document.getElementById('adminLoginBtn').style.display = 'inline-block';
    }

    function verifyAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === 'magawa123') {
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('adminLabel').style.display = 'none';
        document.getElementById('adminPassword').style.display = 'none';
        document.getElementById('adminLoginBtn').style.display = 'none';
        refreshFileList();
      } else {
        alert('Incorrect password');
      }
    }

    function uploadCSV() {
      const className = document.getElementById('classDropdown').value;
      const fileInput = document.getElementById('csvUpload');
      const file = fileInput.files[0];
      const token = document.getElementById('githubToken').value.trim();

      if (!className || !file || !token) {
        alert('Please select a class, choose a file, and enter your GitHub token.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function () {
        const content = reader.result;
        const encodedContent = btoa(unescape(encodeURIComponent(content)));

        fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${className}.csv`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Upload ${className}.csv`,
            content: encodedContent
          })
        })
        .then(res => res.json())
        .then(() => {
          alert('Upload successful.');
          refreshFileList();
        })
        .catch(() => alert('Upload failed. Check token and repo permissions.'));
      };
      reader.readAsText(file);
    }

    function deleteCSV() {
      const fileName = document.getElementById('deleteDropdown').value;
      const token = document.getElementById('githubToken').value.trim();

      if (!fileName || !token) {
        alert('Please select a file and enter your GitHub token.');
        return;
      }

      fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(fileData => {
        const sha = fileData.sha;

        fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${fileName}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Delete ${fileName}`,
            sha: sha
          })
        })
        .then(() => {
          alert('File deleted.');
          refreshFileList();
        })
        .catch(() => alert('Delete failed. Check token and file name.'));
      });
    }

    function refreshFileList() {
      fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`)
        .then(res => res.json())
        .then(files => {
          const dropdown = document.getElementById('deleteDropdown');
          dropdown.innerHTML = '<option value="">-- Select CSV File --</option>';
          files.forEach(file => {
            if (file.name.endsWith('.csv')) {
              const opt = document.createElement('option');
              opt.value = file.name;
              opt.textContent = file.name;
              dropdown.appendChild(opt);
            }
          });
        })
        .catch(() => alert('Failed to load file list.'));
    }

    // loadResults(), getGrade(), getSubjectRemark(), gradeToNumber(), openPrintView(), openFullPdf()
    // — already included in Part 1

  </script>
</body>
</html>
